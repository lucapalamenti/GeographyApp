<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Map</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/all.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/create.css" />

    <script src="js/create/create.js" type="module"></script>
    <script src="js/create/mapInteraction.js" type="module"></script>
    <script src="js/components/header.js"></script>
</head>
<body>
    <app-header></app-header>
    <main class="flex-col-center gap-5">
        <section class="flex-row-center-start gap-5">
            <form id="create-form" class="flex-col gap-5 form-1">
                <h3>Create Custom Map</h3>
                <div class="input-label">
                    <label for="map-name">Map Name</label>
                    <input type="text" name="map-name" id="map-name" required>
                </div>
                <div class="input-label">
                    <label for="select-template">Choose Template</label>
                    <select name="select-template" id="select-template" required>
                        <option value="-1">Select</option>
                    </select>
                </div>
                <div class="input-label">
                    <label for="map-color">Select Icon Color</label>
                    <input type="color" id="map-color">
                </div>
                <div class="input-label">
                    <label for="map-thumbnail">Select a Thumbnail</label>
                    <input type="file" name="thumbnail" accept="image/png,image/jpeg" id="map-thumbnail">
                </div>
                
                <nav class="flex-row gap-5">
                    <button type="submit" id="create-button" class="btn-green hover-fade">Create</button>
                    <a href="../" class="btn-grey hover-fade">Cancel</a>
                </nav>
            </form>
            <div id="modification-buttons-panel" class="flex-col-center gap-5">
                <div id="main-buttons" class="form-1 flex-col gap-5">
                    <button type="button" id="reset-selection-btn" class="btn-red hover-fade">Deselect All</button>
                    <button type="button" value="moving" id="move-regions-btn" class="btn-grey hover-fade">Move Regions</button>
                    <button type="button" value="setting" id="set-region-type-btn" class="btn-grey hover-fade">Set Region Type</button>
                </div>
                <div id="set-region-type-panel" class="flex-row gap-5">
                    <button type="button" id="invisible-btn" class="btn-icon"><p><b>Invisible - </b>Regions won't show up on map</p></button>
                    <button type="button" id="enabled-btn" class="btn-icon"><p><b>Enabled - </b>Regions the user is prompted for</p></button>
                    <button type="button" id="disabled-btn" class="btn-icon"><p><b>Disabled - </b>Regions affect map centering, but user is not prompted for them</p></button>
                    <button type="button" id="outside-btn" class="btn-icon"><p><b>Outside - </b>Regions dont't affect map centering & are not prompted for</p></button>
                </div>
            </div>
            
        </section>

        <section hidden id="map-container" class="flex-col-center">
            <div id="top-map-bar" class="game-bar">
                <div class="input-label">
                    <input type="checkbox" id="show-outline">
                    <label for="show-outline">Show Outline</label>
                </div>
                <div class="dotted-line"></div>
            </div>
            
            <svg viewBox="0 0 1600 900" preserveAspectRatio="none" id="templateMap" class="container-1">
                <rect id="map-outline"></rect>
            </svg>
        </section>
        
        <!-- Displayed after selecting regions -->
        <div id="selected-list" class="form-1"></div>
    </main>

    <div id="loading-screen">CREATING MAP . . .</div>

    <!-- Templates -->

</body>
</html>
